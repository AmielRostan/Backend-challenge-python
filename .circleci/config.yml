
version: 2.1

orbs:
  coveralls: coveralls/coveralls@2.2.5

jobs:
  test:
    docker:
      - image: cimg/python:3.13
      - image: cimg/postgres:15.0
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: usersdb_test

    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/usersdb_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/usersdb_test
      POKEMON_API_URL: https://pokeapi.co/api/v2

    steps:
      - checkout

      - run:
          name: Install uv
          command: pip install uv

      - run:
          name: Install dependencies
          command: uv sync --frozen

      - run:
          name: Run Ruff
          command: |
            uv run ruff check .
            uv run ruff format --check .

      - run:
          name: Run tests with coverage
          command: uv run pytest --cov=backend_challenge_python --cov-report=term-missing --cov-report=lcov:coverage.lcov
      - coveralls/upload:
          coverage_file: coverage.lcov

workflows:
  build-and-test:
    jobs:
      - test
